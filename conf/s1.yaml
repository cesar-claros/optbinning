# Experiment S1 — cut stability under resampling (Papers C + D).
dataset: gmsc
arms: [optbinning, quantile, ot_ple]
# extra arm learned_knot: the no-OT ordered-knot control (BCE only);
# run it WITH ot_ple in the same command so both share the seed,
# resamples, and reference scale -- the paired stability comparison
# that isolates OT shaping from smoothing (Paper C Sec. 5.6 ix gap)
n_bins: 8
n_resamples: 20
resampling: subsample    # subsample (Paper D: bootstrap inconsistent for cube-root) | bootstrap
subsample_frac: 0.7
test_size: 0.35

# ot_ple arm (Paper C winning setup; reduced epochs — cuts, not AUC, are measured)
hidden: 64
token_mode: ple_interp
sinkhorn_iters: 15
epochs: 15
batch_size: 4096
lr: 0.01
eps_start: 0.15
eps_end: 0.02
aux_iv: 0.1

# synthetic smoke
n: 6000
data_seed: 0

seed: 0
device: cuda
out: outputs/s1
hydra:
  job:
    chdir: false

special_handling: ignore  # 'expand' for sentinel-coded datasets (heloc: -7/-8/-9, baf: -1):
                          # sentinels -> median + per-code indicator features
