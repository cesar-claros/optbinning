# Experiment C4-audit — interpretability substantiation (Paper C §5.6).
dataset: german
n_bins: 8
hidden: 64              # unused by the linear head; kept for TokenizedNet
epochs: 40
batch_size: 4096
lr: 0.01
sinkhorn_iters: 15
eps_start: 0.15
eps_end: 0.02
aux_iv: 0.1             # IV/PAV auxiliary weight (as in C3/C4)
cut_tol: 0.15          # standardized-unit tolerance for a matched cut
ob_solver: cp          # certified-reference solver (cp matches C3/C4; mip is a fallback)
n_seeds: 5
seed_offset: 0
test_size: 0.35
device: cuda            # cuda on GPU nodes
out: outputs/c4_audit
hydra:
  job:
    chdir: false
