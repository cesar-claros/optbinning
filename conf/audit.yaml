# Experiment AUDIT — hardened-guarantee postconditions + static inference
# (Paper C reviewer P0). Binary datasets only; production ot_ple config
# (rank input, ple_interp tokens, IV/PAV aux) with the linear scorecard
# head as the deployment-facing default.
dataset: german
arm: ot_ple              # ot_ple | mass_knot_ot (the unified Option-A model:
                         # benchmark knots = deployment coordinates = C(beta))
backbone: linear         # linear (C4 scorecard head) | mlp | ft
n_bins: 8
sinkhorn_iters: 15       # training unroll; audit hardening uses 60
hidden: 64
epochs: 50
batch_size: 4096
lr: 0.01
lr_ft: 0.001
ft_layers: 2
ft_heads: 4
ft_weight_decay: 1.0e-5
eps_start: 0.15
eps_end: 0.02
aux_iv: 0.1
seed: 0
test_size: 0.35
special_handling: expand   # sentinels -> median + indicators (heloc/baf)
device: cpu                # cuda on GPU nodes
out: outputs/audit
hydra:
  job:
    chdir: false
