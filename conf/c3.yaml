# Experiment C3/C4 — tokenizer benchmark (Paper C).
# backbone=linear is the C4 self-explaining scorecard head;
# backbone=ft is the camera-ready FT-Transformer comparison.
dataset: synthetic-smooth
n: 6000
data_seed: 0
arms: [raw, quantile_ple, target_ple, ot_ple, lightgbm]
# extra arm periodic: Gorishniy's "P" block (learnable sin/cos frequencies)
# under the same heads -- the maximally free, bin-less baseline
periodic_k: 8            # frequencies per feature (token dim = 2k)
periodic_sigma: 1.0      # frequency init scale (Gorishniy tunes this; we fix it)
# extra arm ot_frozen: stage-1 trains the layer end-to-end, then freezes
# its edges and trains a fresh head on their PLE encoding -- isolates
# jointness (ot_ple - ot_frozen) from estimator (ot_frozen - target_ple)
# extra arm optbinning_pw: Navas-Palencia's continuous piecewise binning
# (OptimalPWBinning, degree-1 event-rate transform) -- binary tasks only
# extra arm learned_knot_ple: the no-OT control -- identical ordered-knot
# parametrization, init, PLE basis, backbone, and budget as ot_ple with
# token_mode=ple_interp, but no Sinkhorn/beta/IV/PAV anywhere; the paired
# difference (ot_ple - learned_knot_ple) isolates the OT contribution
# extra arms mass_knot_ple / mass_knot_ot: the UNIFIED mass-coordinate
# model (re-review Option A) -- PLE knots ARE the cumulative masses
# C(beta), identical to the harden_static deployment coordinates; _ple =
# downstream loss only (no-Sinkhorn structural control), _ot = + IV/PAV
# aux with pre-declared per-feature trends (binary tasks)
backbones: [linear, mlp]   # options: linear | mlp | ft
n_bins: 8
sinkhorn_iters: 15      # training-time unroll; hardening uses 60 internally
hidden: 64              # mlp width; d_model for ft (divisible by ft_heads)
epochs: 50
batch_size: 4096          # ot_ple is launch-latency-bound; large batches are free on GPU
lr: 0.01
lr_ft: 0.001            # ft-only lr (AdamW); keeps mixed-backbone sweeps fair
ft_layers: 2
ft_heads: 4
ft_weight_decay: 1.0e-5
eps_start: 0.15
eps_end: 0.02
aux_iv: 0.1             # auxiliary IV/monotonicity weight for ot_ple
seed: 0
test_size: 0.35
device: cpu             # cuda on GPU nodes
out: outputs/c3
hydra:
  job:
    chdir: false
token_mode: cumulative   # cumulative | assign | cumulative_plus_raw (lossless; +1 dim/feature)
                         # | ple_interp (learned-knot PLE on the layer's edges: lossless +
                         #   basis-rich; interval bins by construction; Sinkhorn only for aux)
ot_input: quantile       # ot_ple bin geometry: quantile (rank space; heavy-tail safe) | standard

special_handling: ignore  # ignore | expand | token, for sentinel-coded datasets
                          # (heloc: -7/-8/-9, baf: -1). expand: sentinels -> median +
                          # per-code indicator features. token: sentinels routed to
                          # reserved per-code token channels (no median atom; clean-row
                          # ECDF; aux sees clean rates; lightgbm gets native codes)
