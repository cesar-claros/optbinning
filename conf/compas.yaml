# Experiment AUDIT — COMPAS case study (Paper C §6): scorecard audit table
# + FM group-disparity certificate + P7 consensus cuts with uncertainty.
model: ot_ple            # ot_ple (C4 scorecard) | logreg (torch-free check)
test_size: 0.35
group_column: race
groups: [African-American, Caucasian]   # two largest groups; others reportable

# scorecard training (reused from the L1 configuration)
n_bins: 6
hidden: 64
token_mode: ple_interp
sinkhorn_iters: 15
epochs: 40
batch_size: 1024
lr: 0.01
eps_start: 0.15
eps_end: 0.02
aux_iv: 0.1

# disparity certificate
lam: 0.1
n_permutations: 500
n_grid: 256

# consensus cuts (P7; subsample folds per Paper D)
n_folds: 25
subsample_fraction: 0.7

seed: 0
device: cuda
out: outputs/compas
hydra:
  job:
    chdir: false
