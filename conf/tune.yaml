# Experiment TUNE — Optuna-tuned arm comparison (Gorishniy protocol).
dataset: gesture
arms: [ot_ple, quantile_ple, target_ple, periodic]
backbones: [mlp, ft]
n_trials: 50             # identical TPE budget per (arm, backbone)
eval_seeds: 5            # incumbent refits with fresh torch seeds
max_epochs: 100
patience: 16             # early stopping on val (best-state restore)
batch_size: 1024
special_handling: ignore

seed: 0                  # split + sampler seed
device: cuda
out: outputs/tune
hydra:
  job:
    chdir: false
